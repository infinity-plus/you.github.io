<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click to See</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d6efd 0%, #6f42c1 100%);
    }
    .hero-card {
      max-width: 420px;
      border: 0;
      border-radius: 1.25rem;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.18);
    }
    .preview-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(13, 110, 253, 0.1);
      color: #0d6efd;
      margin: 0 auto 1rem;
      font-size: 2rem;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <main class="card hero-card">
    <div class="card-body text-center p-4 p-md-5">
      <div class="preview-icon">✨</div>
      <h1 class="h3 fw-bold mb-2">See What Happens</h1>
      <p class="text-secondary mb-4">
        Tap the button below to continue and see more.
      </p>
      <a
        class="btn btn-primary btn-lg px-4 py-2 w-100"
        href="intent://scan/#Intent;action=android.media.action.IMAGE_CAPTURE;S.browser_fallback_url=https%3A%2F%2Fexample.com%2Ffallback;end"
      >
        Click to See
      </a>
      <p class="small text-muted mt-3 mb-0">Works best on supported Android browsers.</p>
    </div>
  </main>
</body>
</html>
