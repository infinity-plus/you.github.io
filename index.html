<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click to See</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d6efd 0%, #6f42c1 100%);
    }
    .hero-card {
      max-width: 460px;
      border: 0;
      border-radius: 1.25rem;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }
    .preview-shell {
      background: #111;
      border-radius: 1rem;
      overflow: hidden;
      aspect-ratio: 9 / 16;
      display: grid;
      place-items: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transform: scaleX(-1);
    }
    .preview-message {
      color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      padding: 1rem;
      text-align: center;
      position: absolute;
      inset: auto 0 1rem 0;
      z-index: 2;
    }
    .placeholder {
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 1.5rem;
    }
    .status-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <main class="card hero-card w-100">
    <div class="card-body p-4 p-md-4 text-center">
      <h1 class="h3 fw-bold mb-2">Click to See</h1>
      <p class="text-secondary mb-4">Tap below to continue.</p>

      <div class="preview-shell mb-3">
        <span class="badge rounded-pill status-badge">Live Preview</span>
        <video id="camera" autoplay playsinline muted></video>
        <div id="placeholder" class="placeholder">
          <div class="fs-1 mb-2">✨</div>
          <div>Tap the button below to continue</div>
        </div>
        <div id="previewMessage" class="preview-message d-none">If prompted, allow access to continue.</div>
      </div>

      <button id="startBtn" class="btn btn-primary btn-lg w-100 py-2">Click to See</button>
      <p id="note" class="small text-muted mt-3 mb-0">Best experience on mobile browsers.</p>
    </div>
  </main>

  <script>
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('camera');
    const placeholder = document.getElementById('placeholder');
    const previewMessage = document.getElementById('previewMessage');
    const note = document.getElementById('note');

    async function startPreview() {
      previewMessage.classList.remove('d-none');
      startBtn.disabled = true;
      startBtn.textContent = 'Loading...';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        previewMessage.classList.add('d-none');
        startBtn.classList.add('d-none');
        note.textContent = 'Preview started.';
      } catch (error) {
        startBtn.disabled = false;
        startBtn.textContent = 'Try Again';
        note.textContent = 'Access is required to continue.';
      }
    }

    startBtn.addEventListener('click', startPreview);
  </script>
</body>
</html>
